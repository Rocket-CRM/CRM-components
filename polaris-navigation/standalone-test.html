<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris Navigation - Standalone Test</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .nav-container {
      width: 300px;
      height: 700px;
      background: #ebebeb;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .debug-panel {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #console-logs {
      max-height: 600px;
      overflow-y: auto;
      background: #1e1e1e;
      color: #d4d4d4;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log-entry {
      margin-bottom: 4px;
      padding: 2px 0;
    }
    .log-error { color: #f48771; }
    .log-warn { color: #dcdcaa; }
    .log-info { color: #4ec9b0; }
    h1 { margin-bottom: 20px; }
    .status {
      padding: 12px;
      border-radius: 4px;
      margin-bottom: 15px;
      font-weight: 500;
    }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }
    .status.info { background: #e3f2fd; color: #1976d2; }
  </style>
</head>
<body>
  <h1>Polaris Navigation - Standalone Component Test</h1>
  
  <div class="container">
    <div class="nav-container">
      <div id="navigation-root"></div>
    </div>
    
    <div class="debug-panel">
      <div id="status" class="status info">Initializing component...</div>
      <h3>Console Logs</h3>
      <div id="console-logs"></div>
    </div>
  </div>

  <script type="module">
    const { createApp, ref, computed, watch, onMounted, onUnmounted, nextTick } = Vue;

    // Mock WeWeb environment
    window.wwLib = {
      wwVariable: {
        useComponentVariable: function(options) {
          const value = ref(options.defaultValue || '');
          return {
            value: value,
            setValue: function(newValue) {
              value.value = newValue;
            }
          };
        }
      },
      wwUtils: {
        getCdnPrefix: function() {
          return '';
        }
      },
      useIcons: function() {
        return {
          getIcon: async function(iconName) {
            return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="currentColor"/></svg>`;
          }
        };
      },
      goTo: function(href) {
        console.log('[Mock Navigation] Would navigate to:', href);
      }
    };

    // Console log capture
    const logContainer = document.getElementById('console-logs');
    const statusDiv = document.getElementById('status');
    
    function updateStatus(message, type = 'info') {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
    }

    function addLog(type, ...args) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry log-${type}`;
      const message = args.map(arg => {
        if (typeof arg === 'object') {
          try {
            return JSON.stringify(arg, null, 2);
          } catch (e) {
            return String(arg);
          }
        }
        return String(arg);
      }).join(' ');
      logEntry.textContent = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;

    console.log = function(...args) {
      originalLog.apply(console, args);
      addLog('info', ...args);
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLog('warn', ...args);
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      addLog('error', ...args);
    };

    // Test data with images
    const testContent = {
      navigationItems: [
        {
          "id": "rewards",
          "href": "/reward",
          "icon": null,
          "badge": null,
          "image": "https://api.iconify.design/lucide/gift.svg",
          "activeImage": "https://api.iconify.design/lucide/gift.svg?color=%234F46E5",
          "label": "Reward",
          "active": false,
          "subItems": [
            {
              "id": "reward-list",
              "href": "/reward",
              "label": "Reward list",
              "active": false
            },
            {
              "id": "promo-codes-lots",
              "href": "/promo-codes-lots",
              "label": "Promo codes lots",
              "active": false
            }
          ]
        },
        {
          "id": "tiers-personas",
          "href": "/tiers-personas",
          "badge": null,
          "image": "https://api.iconify.design/lucide/award.svg",
          "label": "Tier & Personas",
          "active": false,
          "subItems": [],
          "activeImage": ""
        },
        {
          "id": "currency",
          "href": "/currency",
          "badge": null,
          "image": "https://api.iconify.design/lucide/coins.svg",
          "label": "Currency",
          "active": false,
          "subItems": [
            {
              "id": "earn-factor-group",
              "href": "/earn-factor-groups",
              "label": "Earn factor group",
              "active": false
            }
          ],
          "activeImage": ""
        }
      ],
      showIcons: true,
      showBadges: true,
      activeDetection: 'both',
      expansionBehavior: 'both',
      accordionMode: true
    };

    // Start the test - create component directly (no file fetching needed)
    console.log('Starting component test...');
    updateStatus('Creating test component...', 'info');
    
    // Check if we're running via http/https (server) or file:// (direct)
    const isServer = window.location.protocol === 'http:' || window.location.protocol === 'https:';
    
    if (isServer) {
      // Try to load from manager.js if on server
      loadFromManager();
    } else {
      // If opened directly (file://), create test component immediately
      console.log('Opened directly (file://), creating test component...');
      setTimeout(() => {
        createTestComponent();
      }, 100);
    }

    function loadFromManager() {
      console.log('Attempting to load from manager.js...');
      const script = document.createElement('script');
      script.src = './dist/manager.js';
      script.onload = function() {
        console.log('manager.js loaded');
        updateStatus('Component loaded from manager.js. Creating test instance...', 'info');
        
        // Wait a bit for component registration, then create test component
        setTimeout(() => {
          createTestComponent();
        }, 500);
      };
      script.onerror = function() {
        console.error('Failed to load manager.js');
        updateStatus('Failed to load component. Make sure npm run serve is running and access via http://localhost:8080/standalone-test.html', 'error');
        // Fallback: create test component anyway
        createTestComponent();
      };
      document.head.appendChild(script);
    }

    // Create a test component that mimics the navigation
    function createTestComponent() {
      // This is a simplified version for testing
      // In a real scenario, you'd load the actual component
      console.log('Creating test navigation component...');
      
      const app = createApp({
        setup() {
          const content = ref(testContent);
          
          // Simplified version of the component logic
          const processedItems = computed(() => {
            const items = content.value.navigationItems || [];
            console.log('[Navigation] Processing items:', items.length);
            
            return items.map((item, itemIndex) => {
              const itemId = item.id || `item-${itemIndex}`;
              console.log('[Navigation] Processed item:', {
                id: itemId,
                label: item.label,
                isActive: item.active || false,
                image: item.image,
                activeImage: item.activeImage,
                imageType: typeof item.image,
                activeImageType: typeof item.activeImage
              });
              
              return {
                id: itemId,
                label: item.label || 'Untitled',
                href: item.href || '#',
                icon: item.icon,
                activeIcon: item.activeIcon,
                image: item.image,
                activeImage: item.activeImage,
                badge: item.badge,
                isActive: item.active || false,
                hasSubItems: (item.subItems || []).length > 0,
                subItems: (item.subItems || []).map((sub, subIndex) => ({
                  id: sub.id || `sub-${itemId}-${subIndex}`,
                  label: sub.label || 'Untitled',
                  href: sub.href || '#',
                  isActive: sub.active || false
                }))
              };
            });
          });

          const getItemImageSource = (item) => {
            console.log('[Navigation] getItemImageSource for item:', {
              id: item.id,
              label: item.label,
              isActive: item.isActive,
              hasImage: !!item.image,
              hasActiveImage: !!item.activeImage,
              image: item.image,
              activeImage: item.activeImage
            });
            
            if (!item) return null;
            
            let imageSource = null;
            
            if (item.isActive && item.activeImage) {
              const activeImg = String(item.activeImage).trim();
              if (activeImg && activeImg !== '') {
                imageSource = activeImg;
                console.log('[Navigation] Using activeImage:', imageSource);
              }
            }
            
            if (!imageSource && item.image) {
              const regularImg = String(item.image).trim();
              if (regularImg && regularImg !== '') {
                imageSource = regularImg;
                console.log('[Navigation] Using regular image:', imageSource);
              }
            }
            
            if (!imageSource) {
              console.log('[Navigation] No valid image source found');
              return null;
            }

            console.log('[Navigation] Final image source:', imageSource);
            return imageSource;
          };

          return {
            processedItems,
            getItemImageSource,
            showIcons: computed(() => content.value.showIcons !== false)
          };
        },
        template: `
          <div style="width: 100%; height: 100%; background: #ebebeb; overflow-y: auto; padding: 16px 0;">
            <ul style="list-style: none; padding: 0; margin: 0;">
              <li v-for="item in processedItems" :key="item.id" style="margin-bottom: 4px;">
                <a :href="item.href" 
                   style="display: flex; align-items: center; padding: 8px 16px; text-decoration: none; color: #202223; border-radius: 8px;"
                   :style="{ background: item.isActive ? '#ffffff' : 'transparent' }"
                   @click.prevent="console.log('Clicked:', item.label)">
                  <div v-if="getItemImageSource(item)" style="width: 20px; height: 20px; margin-right: 8px; flex-shrink: 0;">
                    <img 
                      :src="getItemImageSource(item)" 
                      :alt="item.label"
                      style="width: 100%; height: 100%; object-fit: contain;"
                      @error="(e) => { 
                        console.error('[Navigation] Image failed to load:', getItemImageSource(item), 'for item:', item.label); 
                        e.target.style.display = 'none'; 
                      }"
                      @load="(e) => {
                        console.log('[Navigation] Image loaded successfully:', {
                          itemId: item.id,
                          itemLabel: item.label,
                          imageSource: getItemImageSource(item),
                          naturalWidth: e.target.naturalWidth,
                          naturalHeight: e.target.naturalHeight
                        });
                      }"
                    />
                  </div>
                  <span style="flex: 1;">{{ item.label }}</span>
                  <span v-if="item.badge" style="background: #E0E3E7; padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600;">
                    {{ item.badge }}
                  </span>
                </a>
                <ul v-if="item.hasSubItems" style="list-style: none; padding-left: 32px; margin-top: 4px;">
                  <li v-for="sub in item.subItems" :key="sub.id" style="margin-bottom: 2px;">
                    <a :href="sub.href" 
                       style="display: block; padding: 6px 16px; text-decoration: none; color: #6D7175; font-size: 14px;"
                       :style="{ color: sub.isActive ? '#202223' : '#6D7175', fontWeight: sub.isActive ? 600 : 400 }"
                       @click.prevent="console.log('Clicked sub:', sub.label)">
                      {{ sub.label }}
                    </a>
                  </li>
                </ul>
              </li>
            </ul>
          </div>
        `
      });

      app.mount('#navigation-root');
      updateStatus('Component rendered! Check console logs for image loading details.', 'success');
    }
  </script>
</body>
</html>
