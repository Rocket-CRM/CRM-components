<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Polaris Navigation - Component Test</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }

        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .nav-container {
            width: 300px;
            background: #ebebeb;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .debug-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            max-height: 90vh;
            overflow-y: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        h3 {
            margin: 15px 0 10px;
            color: #333;
        }

        .status {
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            font-weight: 500;
        }

        .status.success {
            background: #e8f5e9;
            color: #2e7d32;
        }

        .status.error {
            background: #ffebee;
            color: #c62828;
        }

        .status.info {
            background: #e3f2fd;
            color: #1976d2;
        }

        /* Navigation Styles */
        .nav-list {
            list-style: none;
            padding: 8px;
        }

        .nav-item {
            margin-bottom: 2px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            text-decoration: none;
            color: #202223;
            border-radius: 8px;
            transition: background 0.15s;
        }

        .nav-link:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .nav-link.active {
            background: #fff;
            font-weight: 600;
        }

        .nav-image {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            flex-shrink: 0;
            /* Make SVG icons visible */
            filter: brightness(0) saturate(100%);
        }

        .nav-label {
            flex: 1;
        }

        .nav-badge {
            background: #E0E3E7;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .sub-list {
            list-style: none;
            padding-left: 32px;
            margin-top: 4px;
        }

        .sub-link {
            display: block;
            padding: 6px 12px;
            text-decoration: none;
            color: #6D7175;
            font-size: 14px;
            border-radius: 6px;
        }

        .sub-link:hover {
            background: rgba(0, 0, 0, 0.03);
        }

        .sub-link.active {
            color: #202223;
            font-weight: 600;
        }

        .data-preview {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 11px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
        }

        .image-test {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .image-test-item {
            border: 1px solid #ddd;
            padding: 8px;
            border-radius: 6px;
            text-align: center;
        }

        .image-test-item img {
            width: 24px;
            height: 24px;
            display: block;
            margin: 0 auto 4px;
        }

        .image-test-item small {
            font-size: 10px;
            color: #666;
        }
    </style>
</head>

<body>
    <h1>🧪 Polaris Navigation - Local Test</h1>

    <div class="container">
        <div class="nav-container">
            <div id="app"></div>
        </div>

        <div class="debug-panel">
            <div id="status" class="status info">Testing component...</div>

            <h3>📋 Test Data</h3>
            <div class="data-preview" id="data-preview"></div>

            <h3>🖼️ Direct Image Tests</h3>
            <div class="image-test">
                <div class="image-test-item">
                    <img src="https://api.iconify.design/lucide:gift.svg?color=%23303030" alt="gift" />
                    <small>gift (6-digit)</small>
                </div>
                <div class="image-test-item">
                    <img src="https://api.iconify.design/lucide:award.svg?color=%23303030" alt="award" />
                    <small>award</small>
                </div>
                <div class="image-test-item">
                    <img src="https://api.iconify.design/lucide:coins.svg?color=%23303030" alt="coins" />
                    <small>coins</small>
                </div>
                <div class="image-test-item">
                    <img src="https://api.iconify.design/lucide:settings.svg?color=%23303030" alt="settings" />
                    <small>settings</small>
                </div>
            </div>

            <h3>📝 Console Output</h3>
            <div class="data-preview" id="console-log" style="max-height: 300px;"></div>
        </div>
    </div>

    <script>
        const { createApp, ref, computed } = Vue;

        // Test data with CORRECT property names and URLs
        const testData = {
            navigationItems: [
                {
                    id: "rewards",
                    href: "/reward",
                    badge: null,
                    imageSource: "https://api.iconify.design/lucide:gift.svg?color=%23303030",
                    activeImageSource: "https://api.iconify.design/lucide:gift.svg?color=%23000000",
                    label: "Reward",
                    active: false,
                    subItems: [
                        { id: "reward-list", href: "/reward", label: "Reward list", active: false },
                        { id: "promo-codes-lots", href: "/promo-codes-lots", label: "Promo codes lots", active: false }
                    ]
                },
                {
                    id: "tiers-personas",
                    href: "/tiers-personas",
                    badge: null,
                    imageSource: "https://api.iconify.design/lucide:award.svg?color=%23303030",
                    activeImageSource: "https://api.iconify.design/lucide:award.svg?color=%23000000",
                    label: "Tier & Personas",
                    active: true,
                    subItems: []
                },
                {
                    id: "currency",
                    href: "/currency",
                    badge: "5",
                    imageSource: "https://api.iconify.design/lucide:coins.svg?color=%23303030",
                    activeImageSource: "https://api.iconify.design/lucide:coins.svg?color=%23000000",
                    label: "Currency",
                    active: false,
                    subItems: [
                        { id: "earn-factor-group", href: "/earn-factor-groups", label: "Earn factor group", active: false }
                    ]
                }
            ]
        };

        // Show data preview
        document.getElementById('data-preview').textContent = JSON.stringify(testData, null, 2);

        // Console capture
        const consoleLog = document.getElementById('console-log');
        const originalLog = console.log;
        console.log = function (...args) {
            originalLog.apply(console, args);
            const msg = args.map(a => typeof a === 'object' ? JSON.stringify(a, null, 2) : String(a)).join(' ');
            consoleLog.textContent += `[LOG] ${msg}\n`;
            consoleLog.scrollTop = consoleLog.scrollHeight;
        };

        // Create Vue app
        const app = createApp({
            setup() {
                const items = ref(testData.navigationItems);

                const processedItems = computed(() => {
                    return items.value.map((item, index) => {
                        // Support both property name formats
                        const imageSource = item.imageSource || item.image || '';
                        const activeImageSource = item.activeImageSource || item.activeImage || '';

                        console.log(`[Nav] Item ${item.label}: imageSource=${imageSource ? 'YES' : 'NO'}`);

                        return {
                            ...item,
                            id: item.id || `item-${index}`,
                            imageSource,
                            activeImageSource,
                            isActive: item.active || false,
                            hasSubItems: (item.subItems || []).length > 0,
                        };
                    });
                });

                const getImageSource = (item) => {
                    if (item.isActive && item.activeImageSource) {
                        return item.activeImageSource;
                    }
                    return item.imageSource || null;
                };

                return { processedItems, getImageSource };
            },
            template: `
        <ul class="nav-list">
          <li v-for="item in processedItems" :key="item.id" class="nav-item">
            <a :href="item.href" 
               class="nav-link" 
               :class="{ active: item.isActive }"
               @click.prevent="console.log('Clicked:', item.label)">
              <img 
                v-if="getImageSource(item)"
                :src="getImageSource(item)" 
                :alt="item.label"
                class="nav-image"
                width="20"
                height="20"
                @load="(e) => console.log('✅ Image loaded:', item.label, e.target.naturalWidth + 'x' + e.target.naturalHeight)"
                @error="(e) => { console.log('❌ Image error:', item.label, getImageSource(item)); e.target.style.opacity = '0.3'; }"
              />
              <span class="nav-label">{{ item.label }}</span>
              <span v-if="item.badge" class="nav-badge">{{ item.badge }}</span>
            </a>
            <ul v-if="item.hasSubItems" class="sub-list">
              <li v-for="sub in item.subItems" :key="sub.id">
                <a :href="sub.href" 
                   class="sub-link" 
                   :class="{ active: sub.active }"
                   @click.prevent="console.log('Clicked sub:', sub.label)">
                  {{ sub.label }}
                </a>
              </li>
            </ul>
          </li>
        </ul>
      `
        });

        app.mount('#app');
        document.getElementById('status').textContent = '✅ Component mounted! Check if images appear above.';
        document.getElementById('status').className = 'status success';
    </script>
</body>

</html>
