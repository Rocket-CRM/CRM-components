<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris Navigation - Direct Test</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .test-container {
      max-width: 300px;
      height: 600px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .debug-panel {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
      max-width: 300px;
    }
    .debug-panel h3 {
      margin-top: 0;
      font-size: 14px;
    }
    #console-logs {
      max-height: 200px;
      overflow-y: auto;
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      border: 1px solid #ddd;
    }
    .log-entry {
      margin-bottom: 5px;
      padding: 2px 0;
    }
    .log-error { color: #d32f2f; }
    .log-warn { color: #f57c00; }
    .log-info { color: #1976d2; }
  </style>
</head>
<body>
  <h1>Polaris Navigation Component Test</h1>
  
  <div class="test-container">
    <div id="navigation-container"></div>
  </div>
  
  <div class="debug-panel">
    <h3>Console Logs</h3>
    <div id="console-logs"></div>
  </div>

  <script type="module">
    // Mock WeWeb environment
    window.wwLib = {
      wwVariable: {
        useComponentVariable: function(options) {
          const value = Vue.ref(options.defaultValue || '');
          return {
            value: value,
            setValue: function(newValue) {
              value.value = newValue;
            }
          };
        }
      },
      wwUtils: {
        getCdnPrefix: function() {
          return '';
        }
      },
      useIcons: function() {
        return {
          getIcon: async function(iconName) {
            return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="currentColor"/></svg>`;
          }
        };
      },
      goTo: function(href) {
        console.log('[Mock] Navigation to:', href);
      }
    };

    // Capture console logs
    const logContainer = document.getElementById('console-logs');
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;

    function addLog(type, ...args) {
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry log-${type}`;
      logEntry.textContent = `[${type.toUpperCase()}] ${args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ')}`;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    console.log = function(...args) {
      originalLog.apply(console, args);
      addLog('info', ...args);
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLog('warn', ...args);
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      addLog('error', ...args);
    };

    // Test data with images
    const testContent = {
      navigationItems: [
        {
          "id": "rewards",
          "href": "/reward",
          "icon": null,
          "badge": null,
          "image": "https://api.iconify.design/lucide/gift.svg",
          "activeImage": "https://api.iconify.design/lucide/gift.svg?color=%234F46E5",
          "label": "Reward",
          "active": false,
          "subItems": [
            {
              "id": "reward-list",
              "href": "/reward",
              "label": "Reward list",
              "active": false
            },
            {
              "id": "promo-codes-lots",
              "href": "/promo-codes-lots",
              "label": "Promo codes lots",
              "active": false
            }
          ]
        },
        {
          "id": "tiers-personas",
          "href": "/tiers-personas",
          "badge": null,
          "image": "https://api.iconify.design/lucide/award.svg",
          "label": "Tier & Personas",
          "active": false,
          "subItems": [],
          "activeImage": ""
        },
        {
          "id": "currency",
          "href": "/currency",
          "badge": null,
          "image": "https://api.iconify.design/lucide/coins.svg",
          "label": "Currency",
          "active": false,
          "subItems": [
            {
              "id": "earn-factor-group",
              "href": "/earn-factor-groups",
              "label": "Earn factor group",
              "active": false
            }
          ],
          "activeImage": ""
        }
      ],
      showIcons: true,
      showBadges: true,
      activeDetection: 'both',
      expansionBehavior: 'both',
      accordionMode: true
    };

    // Load the component from manager.js
    const script = document.createElement('script');
    script.src = './dist/manager.js';
    script.onload = function() {
      console.log('Component script loaded');
      
      // Wait for component to register
      setTimeout(() => {
        // Try to get the component
        if (window.addWwComponent) {
          console.log('WeWeb component system available');
          
          // Create a simple Vue app to render the component
          const { createApp } = Vue;
          
          // We need to import the component differently
          // Since manager.js registers it, we'll create a wrapper
          fetch('./dist/manager.js')
            .then(res => res.text())
            .then(code => {
              // Execute the manager.js code
              eval(code);
              
              // Now try to render using Vue
              console.log('Attempting to render component...');
              
              // Create a simple test app
              const app = createApp({
                setup() {
                  const content = Vue.reactive(testContent);
                  
                  return {
                    content
                  };
                },
                template: `
                  <div style="width: 100%; height: 100%;">
                    <p>Component loading...</p>
                    <p>Check console for component registration</p>
                  </div>
                `
              });
              
              app.mount('#navigation-container');
            });
        } else {
          console.error('WeWeb component system not available');
        }
      }, 100);
    };
    script.onerror = function() {
      console.error('Failed to load manager.js');
      document.getElementById('navigation-container').innerHTML = 
        '<p style="color: red;">Failed to load component. Make sure you run: npm run serve</p>';
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
