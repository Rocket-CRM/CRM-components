<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris Navigation Debug</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .debug-container {
      max-width: 1200px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .debug-panel {
      margin-top: 20px;
      padding: 15px;
      background: #f9f9f9;
      border-radius: 4px;
      border: 1px solid #ddd;
    }
    .debug-panel h3 {
      margin-top: 0;
    }
    .debug-panel pre {
      background: #fff;
      padding: 10px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
    .test-data {
      margin-top: 20px;
    }
    button {
      padding: 8px 16px;
      margin: 5px;
      background: #005BD3;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background: #004A9C;
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="debug-container">
      <h1>Polaris Navigation Debug</h1>
      
      <div class="test-data">
        <h2>Test Navigation</h2>
        <div id="navigation-container"></div>
      </div>
      
      <div class="debug-panel">
        <h3>Console Logs</h3>
        <div id="console-logs" style="max-height: 400px; overflow-y: auto; background: #fff; padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px;"></div>
      </div>
      
      <div class="debug-panel">
        <h3>Test Data</h3>
        <pre id="test-data-display"></pre>
        <button @click="updateTestData">Update Test Data</button>
        <button @click="clearLogs">Clear Logs</button>
      </div>
    </div>
  </div>

  <script>
    // Mock WeWeb environment
    window.wwLib = {
      wwVariable: {
        useComponentVariable: function(options) {
          const value = Vue.ref(options.defaultValue || '');
          return {
            value: value,
            setValue: function(newValue) {
              value.value = newValue;
            }
          };
        }
      },
      wwUtils: {
        getCdnPrefix: function() {
          return '';
        }
      },
      useIcons: function() {
        return {
          getIcon: async function(iconName) {
            return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="currentColor"/></svg>`;
          }
        };
      },
      goTo: function(href) {
        console.log('[Mock] Navigation to:', href);
      }
    };

    // Capture console logs
    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;
    const logContainer = document.getElementById('console-logs');

    function addLog(type, ...args) {
      const logEntry = document.createElement('div');
      logEntry.style.marginBottom = '5px';
      logEntry.style.color = type === 'error' ? '#d32f2f' : type === 'warn' ? '#f57c00' : '#1976d2';
      logEntry.textContent = `[${type.toUpperCase()}] ${args.map(arg => 
        typeof arg === 'object' ? JSON.stringify(arg, null, 2) : String(arg)
      ).join(' ')}`;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    console.log = function(...args) {
      originalLog.apply(console, args);
      addLog('log', ...args);
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLog('warn', ...args);
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      addLog('error', ...args);
    };

    // Test data
    const testNavigationItems = [
      {
        "id": "rewards",
        "href": "/reward",
        "icon": null,
        "badge": null,
        "image": "https://api.iconify.design/lucide/gift.svg",
        "activeImage": "https://api.iconify.design/lucide/gift.svg?color=%234F46E5",
        "label": "Reward",
        "active": false,
        "subItems": [
          {
            "id": "reward-list",
            "href": "/reward",
            "label": "Reward list",
            "active": false
          },
          {
            "id": "promo-codes-lots",
            "href": "/promo-codes-lots",
            "label": "Promo codes lots",
            "active": false
          }
        ]
      },
      {
        "id": "tiers-personas",
        "href": "/tiers-personas",
        "badge": null,
        "image": "https://api.iconify.design/lucide/award.svg",
        "label": "Tier & Personas",
        "active": false,
        "subItems": [],
        "activeImage": ""
      },
      {
        "id": "currency",
        "href": "/currency",
        "badge": null,
        "image": "https://api.iconify.design/lucide/coins.svg",
        "label": "Currency",
        "active": false,
        "subItems": [
          {
            "id": "earn-factor-group",
            "href": "/earn-factor-groups",
            "label": "Earn factor group",
            "active": false
          }
        ],
        "activeImage": ""
      }
    ];

    // Display test data
    document.getElementById('test-data-display').textContent = JSON.stringify(testNavigationItems, null, 2);

    // Load the component (this would need to be built first)
    // For now, we'll create a simple Vue app that mimics the component structure
    const { createApp, ref, computed } = Vue;

    createApp({
      setup() {
        const navigationItems = ref(testNavigationItems);
        
        const updateTestData = () => {
          console.log('Updating test data...');
          // You can modify testNavigationItems here
          navigationItems.value = [...testNavigationItems];
        };

        const clearLogs = () => {
          logContainer.innerHTML = '';
        };

        return {
          navigationItems,
          updateTestData,
          clearLogs
        };
      }
    }).mount('#app');

    console.log('Debug page loaded. Component should be loaded via WeWeb serve command.');
    console.log('To test:');
    console.log('1. Run: npm run serve');
    console.log('2. Add the component in WeWeb editor');
    console.log('3. Bind the navigationItems with the test data');
    console.log('4. Check console logs for image loading issues');
  </script>
</body>
</html>
