<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Polaris Navigation - Component Test</title>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f5f5;
    }
    .container {
      display: flex;
      gap: 20px;
      max-width: 1400px;
      margin: 0 auto;
    }
    .nav-container {
      width: 300px;
      height: 600px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .debug-panel {
      flex: 1;
      background: white;
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    #console-logs {
      max-height: 500px;
      overflow-y: auto;
      background: #f9f9f9;
      padding: 15px;
      border-radius: 4px;
      font-family: 'Monaco', 'Courier New', monospace;
      font-size: 12px;
      border: 1px solid #ddd;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .log-entry {
      margin-bottom: 8px;
      padding: 4px 0;
      border-bottom: 1px solid #eee;
    }
    .log-error { color: #d32f2f; }
    .log-warn { color: #f57c00; }
    .log-info { color: #1976d2; }
    h1 { margin-top: 0; }
    .status {
      padding: 10px;
      border-radius: 4px;
      margin-bottom: 15px;
    }
    .status.success { background: #e8f5e9; color: #2e7d32; }
    .status.error { background: #ffebee; color: #c62828; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav-container">
      <div id="navigation-root"></div>
    </div>
    
    <div class="debug-panel">
      <h1>Polaris Navigation - Debug Console</h1>
      <div id="status" class="status">Loading component...</div>
      <h3>Console Logs</h3>
      <div id="console-logs"></div>
    </div>
  </div>

  <script>
    // Mock WeWeb environment
    window.wwLib = {
      wwVariable: {
        useComponentVariable: function(options) {
          const value = Vue.ref(options.defaultValue || '');
          return {
            value: value,
            setValue: function(newValue) {
              value.value = newValue;
            }
          };
        }
      },
      wwUtils: {
        getCdnPrefix: function() {
          return '';
        }
      },
      useIcons: function() {
        return {
          getIcon: async function(iconName) {
            return `<svg width="20" height="20" viewBox="0 0 20 20"><circle cx="10" cy="10" r="8" fill="currentColor"/></svg>`;
          }
        };
      },
      goTo: function(href) {
        console.log('[Mock Navigation] Going to:', href);
      }
    };

    // Capture console logs
    const logContainer = document.getElementById('console-logs');
    const statusDiv = document.getElementById('status');
    
    function updateStatus(message, type = 'success') {
      statusDiv.textContent = message;
      statusDiv.className = `status ${type}`;
    }

    function addLog(type, ...args) {
      const timestamp = new Date().toLocaleTimeString();
      const logEntry = document.createElement('div');
      logEntry.className = `log-entry log-${type}`;
      const message = args.map(arg => {
        if (typeof arg === 'object') {
          try {
            return JSON.stringify(arg, null, 2);
          } catch (e) {
            return String(arg);
          }
        }
        return String(arg);
      }).join(' ');
      logEntry.textContent = `[${timestamp}] [${type.toUpperCase()}] ${message}`;
      logContainer.appendChild(logEntry);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    const originalLog = console.log;
    const originalWarn = console.warn;
    const originalError = console.error;

    console.log = function(...args) {
      originalLog.apply(console, args);
      addLog('info', ...args);
    };

    console.warn = function(...args) {
      originalWarn.apply(console, args);
      addLog('warn', ...args);
    };

    console.error = function(...args) {
      originalError.apply(console, args);
      addLog('error', ...args);
    };

    // Test data
    const testContent = {
      navigationItems: [
        {
          "id": "rewards",
          "href": "/reward",
          "icon": null,
          "badge": null,
          "image": "https://api.iconify.design/lucide/gift.svg",
          "activeImage": "https://api.iconify.design/lucide/gift.svg?color=%234F46E5",
          "label": "Reward",
          "active": false,
          "subItems": [
            {
              "id": "reward-list",
              "href": "/reward",
              "label": "Reward list",
              "active": false
            },
            {
              "id": "promo-codes-lots",
              "href": "/promo-codes-lots",
              "label": "Promo codes lots",
              "active": false
            }
          ]
        },
        {
          "id": "tiers-personas",
          "href": "/tiers-personas",
          "badge": null,
          "image": "https://api.iconify.design/lucide/award.svg",
          "label": "Tier & Personas",
          "active": false,
          "subItems": [],
          "activeImage": ""
        },
        {
          "id": "currency",
          "href": "/currency",
          "badge": null,
          "image": "https://api.iconify.design/lucide/coins.svg",
          "label": "Currency",
          "active": false,
          "subItems": [
            {
              "id": "earn-factor-group",
              "href": "/earn-factor-groups",
              "label": "Earn factor group",
              "active": false
            }
          ],
          "activeImage": ""
        }
      ],
      showIcons: true,
      showBadges: true,
      activeDetection: 'both',
      expansionBehavior: 'both',
      accordionMode: true
    };

    // Load component
    console.log('Loading Polaris Navigation component...');
    
    const script = document.createElement('script');
    script.src = './dist/manager.js';
    script.onload = function() {
      console.log('✓ manager.js loaded successfully');
      updateStatus('Component script loaded. Check console for component registration.', 'success');
      
      // The component should auto-register via manager.js
      // We'll need to wait a bit and then try to use it
      setTimeout(() => {
        console.log('Component should be registered now. Check WeWeb component system.');
        updateStatus('Component loaded. If you see this, the component system is ready.', 'success');
      }, 500);
    };
    script.onerror = function() {
      console.error('✗ Failed to load manager.js');
      updateStatus('Failed to load component. Make sure npm run serve is running.', 'error');
    };
    document.head.appendChild(script);
  </script>
</body>
</html>
